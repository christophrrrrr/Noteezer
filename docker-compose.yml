# The whole system on one computer: SQL Server, a one-off job that creates the
# two databases, the two services, and nginx serving the static UI.
#
#   docker compose up --build
#   open http://localhost:8080
#
# Nothing here holds a password. The one-off "secrets" service makes random
# local ones on the first start and keeps them in the "secrets" volume; a
# git-ignored .env (see .env.example) can set them instead. Each container
# loads only its own into its environment through docker/secrets/with-secrets.sh.
name: noteezer

services:
  secrets:
    # Reuses the SQL Server image, which is pulled anyway, for its shell. Root
    # only here, to write into the new volume; it exits when done.
    image: mcr.microsoft.com/mssql/server:2022-latest
    user: root
    environment:
      SA_PASSWORD: ${SA_PASSWORD:-}
      INBOX_DB_PASSWORD: ${INBOX_DB_PASSWORD:-}
      REMINDERS_DB_PASSWORD: ${REMINDERS_DB_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
    volumes:
      - secrets:/secrets
      - ./docker/secrets/make-secrets.sh:/local/make-secrets.sh:ro
    entrypoint: ["/bin/sh", "/local/make-secrets.sh"]
    restart: "no"

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      secrets:
        condition: service_completed_successfully
    environment:
      ACCEPT_EULA: "Y"
    # with-secrets.sh sets MSSQL_SA_PASSWORD, the administrator used only by
    # the healthcheck and db-init (the services log in as their own users), and
    # SQLCMDPASSWORD, so the password never shows in a command line. Then it
    # runs the image's own entrypoint and command.
    entrypoint: ["/bin/sh", "/local/with-secrets.sh", "sqlserver"]
    command: ["/opt/mssql/bin/launch_sqlservr.sh", "/opt/mssql/bin/sqlservr"]
    volumes:
      - sqldata:/var/opt/mssql
      - secrets:/secrets:ro
      - ./docker/secrets/with-secrets.sh:/local/with-secrets.sh:ro
    # No port is published: only the containers below can reach the database.
    healthcheck:
      test: ["CMD", "/bin/sh", "/local/with-secrets.sh", "sqlserver", "/opt/mssql-tools18/bin/sqlcmd", "-C", "-S", "localhost", "-U", "sa", "-b", "-Q", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  db-init:
    # Runs db/init.sql once and exits; the services wait for it. It creates
    # the databases and one login per service with these passwords.
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    # with-secrets.sh sets SQLCMDPASSWORD and the two service passwords, which
    # sqlcmd fills into db/init.sql.
    volumes:
      - ./db/init.sql:/db/init.sql:ro
      - secrets:/secrets:ro
      - ./docker/secrets/with-secrets.sh:/local/with-secrets.sh:ro
    entrypoint: ["/bin/sh", "/local/with-secrets.sh", "db-init"]
    command: ["/opt/mssql-tools18/bin/sqlcmd", "-C", "-S", "sqlserver", "-U", "sa", "-b", "-i", "/db/init.sql"]
    restart: "no"

  reminders:
    build:
      context: ./services/reminders
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    depends_on:
      db-init:
        condition: service_completed_successfully
    # with-secrets.sh sets DATABASE_URL, with its own login that can reach only
    # noteezer_reminders, and SESSION_SECRET, shared with inbox to check tokens.
    entrypoint: ["/bin/sh", "/local/with-secrets.sh", "reminders"]
    command: ["python", "-m", "app"]
    volumes:
      - secrets:/secrets:ro
      - ./docker/secrets/with-secrets.sh:/local/with-secrets.sh:ro
    environment:
      CORS_ORIGINS: http://localhost:8080
    ports:
      - "127.0.0.1:8001:8001"

  inbox:
    build:
      context: ./services/inbox
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    depends_on:
      db-init:
        condition: service_completed_successfully
      # Inbox keeps working while reminders is down (ADR-6), so it only waits
      # for reminders to start, not to be healthy.
      reminders:
        condition: service_started
    # with-secrets.sh sets DATABASE_URL (login inbox) and SESSION_SECRET.
    entrypoint: ["/bin/sh", "/local/with-secrets.sh", "inbox"]
    command: ["python", "-m", "app"]
    volumes:
      - secrets:/secrets:ro
      - ./docker/secrets/with-secrets.sh:/local/with-secrets.sh:ro
    environment:
      REMINDERS_URL: http://reminders:8001
      CORS_ORIGINS: http://localhost:8080
      SORTER: ${SORTER:-auto}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"

  ui:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    depends_on:
      - inbox
    environment:
      # The addresses the browser uses, so localhost, not the container names.
      INBOX_URL: http://localhost:8000
      REMINDERS_URL: http://localhost:8001
    volumes:
      - ./ui:/usr/share/nginx/html:ro
      - ./docker/ui/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  sqldata:
  # The local passwords, made by the secrets service. `docker compose down -v`
  # deletes them together with the data.
  secrets:
