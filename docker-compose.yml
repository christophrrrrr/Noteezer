# The whole system on one computer: SQL Server, a one-off job that creates the
# two databases, the two services, and nginx serving the static UI.
#
#   copy .env.example .env      (then fill in the two secrets)
#   docker compose up --build
#   open http://localhost:8080
#
# Secrets come from .env next to this file, which git ignores. Nothing here
# holds a password.
name: noteezer

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      # Plain ${...} on purpose: a "${DB_PASSWORD:?message}" check reads to
      # secret scanners like a password written in the file. Without a value,
      # SQL Server refuses to start and says the password is too weak.
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
      # sqlcmd reads the password from here, so it never shows in a command line.
      SQLCMDPASSWORD: ${DB_PASSWORD}
    volumes:
      - sqldata:/var/opt/mssql
    # No port is published: only the containers below can reach the database.
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-C", "-S", "localhost", "-U", "sa", "-b", "-Q", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  db-init:
    # Runs db/init.sql once and exits; the services wait for it.
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      SQLCMDPASSWORD: ${DB_PASSWORD}
    volumes:
      - ./db/init.sql:/db/init.sql:ro
    entrypoint: ["/opt/mssql-tools18/bin/sqlcmd", "-C", "-S", "sqlserver", "-U", "sa", "-b", "-i", "/db/init.sql"]
    restart: "no"

  reminders:
    build: ./services/reminders
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      DB_SERVER: sqlserver
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: noteezer_reminders
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      CORS_ORIGINS: http://localhost:8080
    ports:
      - "127.0.0.1:8001:8001"

  inbox:
    build: ./services/inbox
    depends_on:
      db-init:
        condition: service_completed_successfully
      # Inbox keeps working while reminders is down (ADR-7), so it only waits
      # for reminders to start, not to be healthy.
      reminders:
        condition: service_started
    environment:
      DB_SERVER: sqlserver
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: noteezer_inbox
      SESSION_SECRET: ${SESSION_SECRET}
      REMINDERS_URL: http://reminders:8001
      CORS_ORIGINS: http://localhost:8080
      SORTER: ${SORTER:-auto}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"

  ui:
    image: nginx:1.27-alpine
    depends_on:
      - inbox
    environment:
      # The addresses the browser uses, so localhost, not the container names.
      INBOX_URL: http://localhost:8000
      REMINDERS_URL: http://localhost:8001
    volumes:
      - ./ui:/usr/share/nginx/html:ro
      - ./docker/ui/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  sqldata:
