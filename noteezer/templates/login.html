{% extends "base.html" %}
{% block body %}
<h1>{{ title }}</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post">
  <input name="email" type="email" placeholder="Email" autocomplete="username" required value="{{ email }}">
  <input name="password" type="password" placeholder="Password" autocomplete="{{ autocomplete }}" required>
  <button type="submit">{{ title }}</button>
</form>
<p><a href="{{ other_href }}">{{ other_label }}</a></p>
{% endblock %}
