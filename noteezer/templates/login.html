{% extends "base.html" %}
{% block body %}
<main class="auth">
  <div class="auth-card">
    <span class="brand">Noteezer</span>
    <h1>{{ title }}</h1>
    <p>Type it once, find it sorted later.</p>
    {% if error %}<p class="banner error">{{ error }}</p>{% endif %}
    <form method="post">
      <input name="email" type="email" placeholder="Email" autocomplete="username" required value="{{ email }}">
      <input name="password" type="password" placeholder="Password" autocomplete="{{ autocomplete }}" required>
      <button class="button primary" type="submit">{{ title }}</button>
    </form>
    <p><a href="{{ other_href }}">{{ other_label }}</a></p>
  </div>
</main>
{% endblock %}
