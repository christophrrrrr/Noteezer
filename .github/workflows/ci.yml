# CI: every push and every pull request (brief §5). A red job blocks the merge.
#
#   lint       ruff over both services, with the rules in ruff.toml, including
#              its Bandit security rules (SAST)
#   test       each service's tests against a real SQL Server container, with
#              coverage of its whole app; below 70% fails. Also fails when
#              openapi.yaml no longer matches the code, or when pip-audit finds
#              a known vulnerability in the service's dependencies (SCA).
#   contracts  system.yaml against system.schema.json, both OpenAPI files
#              against the OpenAPI specification, and system.yaml against
#              the code (scripts/check_system.py)
#   build      both Docker images, exactly as they will ship; not pushed yet.
#              Trivy scans each one and fails on a HIGH or CRITICAL
#              vulnerability that has a fix.
#
# CodeQL runs in its own workflow (codeql.yml). Every action is pinned to a
# full commit SHA, with the version in a comment: a tag can be moved to other
# code, as happened to trivy-action's tags in March 2026 (ADR-9).
#
# CI never touches Azure SQL. On main, cd.yml calls this workflow first
# (workflow_call), so a deploy only happens after these jobs pass, and its own
# push trigger skips main so the jobs do not run twice.
name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install ruff==0.17.4
      - run: ruff check services scripts

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [inbox, reminders]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt

      - name: Start SQL Server
        # A throwaway container that only lives for this job. Its password is
        # made up here and masked in the log, so no secret is stored anywhere.
        run: |
          password="$(openssl rand -hex 16)Ab1"
          echo "::add-mask::$password"
          docker run -d --name sql -p 1433:1433 \
            -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$password" \
            mcr.microsoft.com/mssql/server:2022-latest
          echo "DATABASE_URL=mssql://sa:$password@localhost:1433/master" >> "$GITHUB_ENV"
          for attempt in $(seq 1 60); do
            if docker exec -e SQLCMDPASSWORD="$password" sql \
                 /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -Q "SELECT 1" -b > /dev/null 2>&1; then
              echo "SQL Server is ready"; exit 0
            fi
            sleep 2
          done
          docker logs sql; exit 1

      - run: pip install -r requirements-dev.txt

      - name: Known vulnerabilities in the dependencies (pip-audit)
        # Resolves requirements-dev.txt, which includes requirements.txt, and
        # checks every package against the PyPI and OSV advisories.
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements-dev.txt

      - name: Tests and coverage
        # Settings in pyproject.toml; the threshold is repeated here so the
        # gate is visible in the workflow. Inbox's tests also start the real
        # reminders service as a process (the cross-seam test, ADR-9).
        run: pytest --cov --cov-report=term --cov-fail-under=70

      - name: openapi.yaml matches the code
        run: python ../../scripts/openapi.py --check

  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install check-jsonschema==0.39.0 openapi-spec-validator==0.9.0 PyYAML==6.0.3
      - name: system.schema.json is a valid JSON Schema
        run: check-jsonschema --check-metaschema system.schema.json
      - name: system.yaml follows system.schema.json
        run: check-jsonschema --schemafile system.schema.json system.yaml
      - name: Both OpenAPI documents follow the OpenAPI specification
        run: |
          openapi-spec-validator services/inbox/openapi.yaml
          openapi-spec-validator services/reminders/openapi.yaml
      - name: system.yaml matches the code
        run: python scripts/check_system.py

  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [inbox, reminders]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build the ${{ matrix.service }} image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: services/${{ matrix.service }}
          push: false
          # Azure cannot pull GHCR images that carry a provenance manifest.
          provenance: false
          build-args: GIT_SHA=${{ github.sha }}
          tags: noteezer-${{ matrix.service }}:${{ github.sha }}
          # Into the runner's Docker, so Trivy can scan it.
          load: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Install Trivy
        # One fixed release, checked against its SHA-256, instead of
        # trivy-action, whose tags were replaced with malware in March 2026.
        run: |
          version=0.76.2
          sha256=bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
          file="trivy_${version}_Linux-64bit.tar.gz"
          curl -sSfLO "https://github.com/aquasecurity/trivy/releases/download/v${version}/${file}"
          echo "${sha256}  ${file}" | sha256sum -c -
          tar -xzf "$file" trivy
          sudo mv trivy /usr/local/bin/trivy

      - name: Scan the ${{ matrix.service }} image (Trivy)
        # OS packages of the base image and the Python packages in it. Only a
        # HIGH or CRITICAL vulnerability with a released fix fails the job: one
        # without a fix cannot be acted on yet, and is still printed.
        run: |
          image=noteezer-${{ matrix.service }}:${{ github.sha }}
          trivy image --scanners vuln --no-progress --severity HIGH,CRITICAL "$image"
          trivy image --scanners vuln --no-progress --quiet --skip-db-update \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$image"
